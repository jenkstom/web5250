# ─────────────────────────────────────────────────────────────────────────────
# web5250 pipeline: validate → container image → GitHub Container Registry
#
# validate: typecheck + full build on Node 22 (mirrors .gitlab-ci.yml).
# image:    one native builder per platform (amd64 on ubuntu-latest, arm64 on
#           the free ubuntu-24.04-arm runner — no QEMU, each build is minutes),
#           each pushing a single-platform image by digest.
# merge:    stitches the digests into one multi-arch manifest under the
#           release tags. Pull requests validate the build only — no login,
#           no push.
#
# Push policy (same as the GitLab pipeline):
#   every push to main → :sha-<short> and :main
#   main (default)     → :latest (on top of the above)
#   tag v*             → :<tag-name> and :latest (on top of the SHA tag)
#
# Pull the result with:
#   docker pull ghcr.io/jenkstom/web5250:latest
#
# Note: the first GHCR publish creates the package as PRIVATE — flip it to
# public once under the repo's Packages settings.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/jenkstom/web5250

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build          # vite (SPA) + esbuild (server + mock) — build as test

  image:
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR builds validate only: no registry login (works from forks), no push.
      - name: Build (validation only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push an untagged single-platform image; tags are applied later, at
      # manifest-merge time. provenance=false keeps the public manifest free
      # of attestation entries, which some registries/tooling don't expect.
      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: |
            org.opencontainers.image.title=web5250
            org.opencontainers.image.description=Web-to-5250 (TN5250) terminal gateway for IBM i / AS/400
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Create multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          args=""
          for t in $TAGS; do args="$args -t $t"; done
          for f in "$DIGEST_DIR"/*; do
            args="$args ${REGISTRY_IMAGE}@sha256:$(basename "$f")"
          done
          docker buildx imagetools create $args
